<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Quick Preview hover demo</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../lib/highlights.css">
<style>
/* renderAt seeks the reveal and pulse at the exact exported frame. */
#markers .qp-segment, #markers .qp-segment::before, #markers .qp-segment::after {animation:none;transition:none}
#markers .qp-segment::before {opacity:var(--pulse,1)}
*{margin:0} #scene{width:2560px;height:1300px;overflow:hidden;border-radius:60px} svg{display:block}</style>
</head><body>
<div id="scene" data-composition-id="main" data-start="0" data-duration="10" data-width="2560" data-height="1300">
<svg width="2560" height="1300" viewBox="22 37 1676 851" xmlns="http://www.w3.org/2000/svg">
  <image href="assets/readme-art.png" width="1728" height="902"/>
  <!-- Replace the baked-in cursor and button so each can move independently. -->
  <rect x="354" y="410" width="66" height="95" fill="white"/>
  <circle cx="384" cy="440" r="25" fill="#ff5700"/>
  <path d="m378 427 15 13-15 13 4-13z" fill="white"/>
  <circle id="ring" cx="384" cy="440" r="29" fill="none" stroke="#ff5700" stroke-width="3.5" stroke-linecap="round" pathLength="1" stroke-dasharray="1" transform="rotate(-90 384 440)"/>
  <foreignObject x="359" y="498" width="785" height="78">
    <div xmlns="http://www.w3.org/1999/xhtml" id="markers" class="qp-wave"
         style="position:relative;width:930px;height:78px;--qp-wave-height:53px;--primary-color:#fff;--special-color:#f50"></div>
  </foreignObject>
  <g id="cursor" stroke-linejoin="round" stroke="#262626" stroke-width="2.7" fill="white" style="filter:drop-shadow(0 2px 2px #0004)">
    <path id="arrow" d="M0 0 3 27 10 19 17 31 22 28 15 16 26 15Z"/>
    <path id="hand" d="M0 17V3Q0 -3 5 0Q7 1 7 5V13Q10 7 14 12Q18 7 22 13Q29 9 29 17V26Q29 31 25 37H7L-6 22Q-9 15 -4 15Z"/>
  </g>
</svg></div>
<script>
const byId = id => document.getElementById(id);
const sampleCount = 4;
const markers = Array.from({length: sampleCount}, (_, i) => {
  const marker = document.createElement('span');
  marker.className = 'qp-segment';
  marker.style.left = (100 * (i+1) / (sampleCount+1)) + '%';
  marker.style.width = (100 * 6 / 180) + '%'; // Six seconds on a three-minute track.
  marker.style.transformOrigin = 'left center';
  byId('markers').append(marker);
  return marker;
});
const clamp = n => Math.max(0, Math.min(1, n));
function ease(n) { const p = clamp(n); return p*p*(3-2*p); }
function renderAt(t) {
  const approach = ease((t-.25)/1.25) - ease((t-8.55)/1.15);
  const x = 540 - 153*approach;
  const y = 636 - 186*approach - 25*Math.sin(Math.PI*approach);
  const hovering = Math.hypot(x-384,y-440) < 25;
  byId('cursor').setAttribute('transform', `translate(${x} ${y})`);
  byId('arrow').style.display = hovering ? 'none' : '';
  byId('hand').style.display = hovering ? '' : 'none';
  const progress = clamp((t-1.75)/6.8);
  const fade = 1-ease((t-8.65)/.32);
  byId('ring').style.opacity = ease((t-1.3)/.25)*fade;
  byId('ring').style.strokeDashoffset = 1-progress;
  markers.forEach((marker, i) => {
    const reveal = ease((t - 1.3 - i*.055) / .24);
    marker.style.transform = `scaleX(${reveal})`;
    marker.style.opacity = fade;
    const playing = t >= 1.75 && i === Math.min(3, Math.floor(progress*sampleCount));
    marker.classList.toggle('qp-playing', playing);
    const elapsed = t - 1.75 - i*1.7;
    const pulse = .59 + .41*Math.cos(2*Math.PI*elapsed/.8);
    marker.style.setProperty('--pulse', playing ? pulse : 1);
  });
}
renderAt(0);
gsap.registerPlugin({name:'previewClock',init(){},render:ratio=>renderAt(ratio*10)});
window.__timelines = {main:gsap.timeline({paused:true}).to({}, {previewClock:1,duration:10,ease:'none'})};
if (location.protocol === 'file:') window.__timelines.main.repeat(-1).play();
</script></body></html>
